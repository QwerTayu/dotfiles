# herdr の設定（~/.config/herdr/config.toml にリンクされる）
# 設定できる項目とデフォルト値は `herdr --default-config` で全部見られる。
# 変更したら `herdr server reload-config` で起動中の herdr に反映する。

# 初回のオンボーディング画面を出さない
onboarding = false

[experimental]
kitty_graphics = true
# プレフィックスモード（Ctrl+b）の間だけ入力ソースを英字にして、終わったら元の入力ソースに戻す。
# 日本語入力のままだとプレフィックスの後のキーが IME に取られてコマンドにならないため。
switch_ascii_input_source_in_prefix = true

# 色は VS Code の Dark Modern に合わせている。
# one-dark を土台にして、全部の色を上書きする。
[theme]
name = "one-dark"

[theme.custom]
panel_bg = "#1F1F1F"
sidebar_bg = "#181818"
active_row_bg = "#2A2D2E"
selection_bg = "#04395E"
surface0 = "#2B2B2B"
surface1 = "#3C3C3C"
surface_dim = "#181818"
overlay0 = "#6E7681"
overlay1 = "#868686"
text = "#CCCCCC"
subtext0 = "#9D9D9D"
accent = "#0078D4"
blue = "#4DAAFC"
green = "#2EA043"
red = "#F85149"
yellow = "#CCA700"
teal = "#4EC9B0"
peach = "#CE9178"
mauve = "#C586C0"

# サイドバーのエージェントの行。デフォルトの並びに、未読の印（herdr-marks-as-unread の $herdr_mark）を足す。
# 印は state_icon のすぐ後ろに置く（herdr はこの 2 つの間にだけ区切りの「 · 」を入れないため）
[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "$herdr_mark", fg = "#4EC9B0", bold = true, dim = false }, "machine", "workspace", "tab"],
  ["agent"],
]

# prefix+m で、今のエージェントに未読の印を付ける・外す（QwerTayu/herdr-marks-as-unread）。そのペインに戻ると消える
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "local.herdr-marks.toggle"
description = "Toggle agent marker"

# prefix+shift+l で、今のタブを claude / fresh / lazygit / ターミナル の並びにする（herdr/plugins/dev-layout）
[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "qwertayu.dev-layout.apply"
description = "dev layout"
